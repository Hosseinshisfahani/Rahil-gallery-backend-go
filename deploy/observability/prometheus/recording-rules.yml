groups:
  - name: rahil_api_recording
    interval: 30s
    rules:
      - record: rahil:api_requests:rate5m
        expr: sum(rate(rahil_api_requests_total[5m])) by (service, method, status_code, path)

      - record: rahil:api_errors:rate5m
        expr: sum(rate(rahil_api_requests_total{status_code=~"5.."}[5m])) by (service, method, path)

      - record: rahil:api_client_errors:rate5m
        expr: sum(rate(rahil_api_requests_total{status_code=~"4.."}[5m])) by (service, method, path)

      - record: rahil:api_latency:p50_5m
        expr: histogram_quantile(0.50, sum(rate(rahil_api_request_duration_seconds_bucket[5m])) by (le, service, method, path))

      - record: rahil:api_latency:p95_5m
        expr: histogram_quantile(0.95, sum(rate(rahil_api_request_duration_seconds_bucket[5m])) by (le, service, method, path))

      - record: rahil:api_latency:p99_5m
        expr: histogram_quantile(0.99, sum(rate(rahil_api_request_duration_seconds_bucket[5m])) by (le, service, method, path))

      - record: rahil:api_requests:in_flight
        expr: sum(rahil_api_requests_in_progress_total) by (service, method)
