name: Deploy API

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit tests
        run: go test ./internal/... -count=1

      - name: Build Docker image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t rahil-gallery-api:${{ github.sha }} .

      - name: Build production CLI tools
        run: |
          mkdir -p bin
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/seed-prod ./cmd/seed-prod
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/backfill-crm ./cmd/backfill-crm

      - name: Save image tarball
        run: docker save rahil-gallery-api:${{ github.sha }} | gzip > api-image.tar.gz

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync deploy scripts on server
        run: |
          tar -czf repo-sync.tar.gz \
            Makefile \
            bin/seed-prod \
            bin/backfill-crm \
            scripts/deploy-remote.sh \
            scripts/export-compose-env.sh \
            docker-compose.prod.yml \
            docker-compose.observability.yml \
            deploy/observability \
            migrations
          scp -o StrictHostKeyChecking=yes repo-sync.tar.gz \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/server-repo-sync.tar.gz"
          ssh -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p ${SERVER_DEPLOY_PATH}/bin ${SERVER_DEPLOY_PATH}/scripts ${SERVER_DEPLOY_PATH}/migrations ${SERVER_DEPLOY_PATH}/deploy && tar -xzf /tmp/server-repo-sync.tar.gz -C ${SERVER_DEPLOY_PATH} && chmod +x ${SERVER_DEPLOY_PATH}/bin/seed-prod ${SERVER_DEPLOY_PATH}/bin/backfill-crm && rm -f /tmp/server-repo-sync.tar.gz"
        env:
          SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}

      - name: Upload image and deploy
        run: |
          scp -o StrictHostKeyChecking=yes api-image.tar.gz \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/api-image.tar.gz"
          ssh -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "bash ${SERVER_DEPLOY_PATH}/scripts/deploy-remote.sh /tmp/api-image.tar.gz ${GITHUB_SHA}"
        env:
          GITHUB_SHA: ${{ github.sha }}
          SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
