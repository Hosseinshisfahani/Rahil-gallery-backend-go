name: CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-server-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: rahil-gallery-api
  CLIENT_REPO: aliakbarebrahimy/Rahil-Gallery-Client

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit tests
        run: go test ./internal/... -count=1

      - name: Feature tests
        run: go test ./tests/feature/... -count=1

      - name: BDD tests
        run: go test ./tests/bdd/... -count=1

      - name: Build API binary
        run: go build -o /dev/null ./cmd/api

      - name: Verify Docker image builds
        run: docker build -t ${{ env.IMAGE_NAME }}:ci .

  deploy:
    name: Deploy API to production
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Docker image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Build production CLI tools
        run: |
          mkdir -p bin
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/seed-prod ./cmd/seed-prod
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/backfill-crm ./cmd/backfill-crm

      - name: Save image tarball
        run: docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} | gzip > api-image.tar.gz

      - name: Bundle base Docker images
        run: bash scripts/bundle-docker-images.sh base-images.tar.gz

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync server source on VPS
        run: |
          GITHUB_SHA=${{ github.sha }} bash scripts/package-server-source.sh server-source.tar.gz
          scp -o StrictHostKeyChecking=yes server-source.tar.gz \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/server-source.tar.gz"
          ssh -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -euo pipefail
             STAGING=\$(mktemp -d)
             trap 'rm -rf \"\$STAGING\"' EXIT
             tar -xzf /tmp/server-source.tar.gz -C \"\$STAGING\"
             mkdir -p \"${SERVER_DEPLOY_PATH}\"
             rsync -a --delete \
               --exclude '.env' \
               --exclude 'data/' \
               \"\$STAGING/\" \"${SERVER_DEPLOY_PATH}/\"
             chmod +x \"${SERVER_DEPLOY_PATH}/bin/seed-prod\" \"${SERVER_DEPLOY_PATH}/bin/backfill-crm\" 2>/dev/null || true
             rm -f /tmp/server-source.tar.gz
             echo \"==> Server source synced to ${SERVER_DEPLOY_PATH} (\$(cat \"${SERVER_DEPLOY_PATH}/.deploy-sha\" 2>/dev/null || echo unknown))\""
        env:
          SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}

      - name: Upload image and deploy
        run: |
          scp -o StrictHostKeyChecking=yes api-image.tar.gz base-images.tar.gz \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/"
          ssh -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "bash ${SERVER_DEPLOY_PATH}/scripts/deploy-remote.sh /tmp/api-image.tar.gz ${GITHUB_SHA} /tmp/base-images.tar.gz"
        env:
          GITHUB_SHA: ${{ github.sha }}
          SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}

      - name: Verify API health
        run: |
          for attempt in $(seq 1 15); do
            if ssh -o StrictHostKeyChecking=yes \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "curl -sf http://127.0.0.1:8080/health/ready >/dev/null"; then
              echo "API health check passed"
              exit 0
            fi
            echo "Waiting for API (attempt ${attempt}/15)..."
            sleep 4
          done
          echo "API health check failed"
          exit 1

      - name: Trigger client deploy
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
          CLIENT_REPO: ${{ env.CLIENT_REPO }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "REPO_DISPATCH_TOKEN not configured — skipping chained client deploy"
            exit 0
          fi
          gh api "repos/${CLIENT_REPO}/dispatches" \
            -f event_type=deploy-after-api \
            -f "client_payload[api_sha]=${GITHUB_SHA}" \
            -f "client_payload[triggered_by]=${GITHUB_REPOSITORY}@${GITHUB_SHA}"
