# Database + migrations only (run API locally with `make dev`).
# Postgres publishes on host port ${POSTGRES_PORT:-5433} to avoid clashing with other DBs on :5432.
services:
  db:
    extends:
      file: docker-compose.yml
      service: db
    ports:
      - "${POSTGRES_PORT:-5433}:5432"

  migrate:
    extends:
      file: docker-compose.yml
      service: migrate
