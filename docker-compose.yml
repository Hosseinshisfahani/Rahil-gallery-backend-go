services:
  db:
    image: postgres:16-alpine
    container_name: rahil-gallery-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rahil_gallery
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rahil_gallery"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    image: migrate/migrate:v4.18.1
    container_name: rahil-gallery-migrate
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://postgres:postgres@db:5432/rahil_gallery?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.io,https://proxy.golang.org,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
    container_name: rahil-gallery-api
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./data/catalog-images:/app/data/catalog-images:ro
      - ./data/customer-signatures:/app/data/customer-signatures
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/rahil_gallery?sslmode=disable
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-docker-secret-change-in-production}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}
      CATALOG_ASSETS_DIR: /app/data/catalog-images
      CUSTOMER_SIGNATURES_DIR: /app/data/customer-signatures
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
